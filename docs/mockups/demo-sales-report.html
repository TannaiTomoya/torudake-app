<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>月別売上 三期比較（デモ用の架空の帳票）</title>
<style>
  @page { size: A4 landscape; margin: 14mm; }
  body { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; color: #111; margin: 24px; }
  h1 { font-size: 22px; text-align: center; letter-spacing: .3em; margin: 0 0 4px; }
  .meta { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { border: 1px solid #333; padding: 6px 10px; }
  th { background: #eee; font-weight: normal; }
  td { text-align: right; font-variant-numeric: tabular-nums; }
  td:first-child { text-align: center; }
  tfoot td { font-weight: bold; background: #f6f6f6; }
  .note { font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<h1>月別売上 三期比較表</h1>
<div class="meta">
  <span>デモ建機 御中（架空）</span>
  <span>単位：円　決算月：7月　出力日：2026年10月24日</span>
</div>
<table>
  <thead>
    <tr><th>月</th><th>前々期（2024年8月〜2025年7月）</th><th>前期（2025年8月〜2026年7月）</th><th>今期（2026年8月〜2027年7月）</th></tr>
  </thead>
  <tbody id="rows"></tbody>
  <tfoot><tr id="total"></tr></tfoot>
</table>
<p class="note">※ デモ用の架空の数字です（`torudake:seed-demo` と同じ。今期10月だけ 4,300,000 円にしてある）。実在の会社・帳票とは関係ありません。</p>
<script>
  const rows = [
    ['8月', 3128000, 3400000, 3672000],
    ['9月', 3312000, 3600000, 3888000],
    ['10月', 4600000, 5000000, 4300000],
    ['11月', 4968000, 5400000, null],
    ['12月', 4784000, 5200000, null],
    ['1月', 2576000, 2800000, null],
    ['2月', 2392000, 2600000, null],
    ['3月', 3312000, 3600000, null],
    ['4月', 2944000, 3200000, null],
    ['5月', 3128000, 3400000, null],
    ['6月', 4048000, 4400000, null],
    ['7月', 4048000, 3520000, null],
  ];
  const yen = (v) => v === null ? '—' : v.toLocaleString('ja-JP');
  const sum = (i) => rows.reduce((s, r) => s + (r[i] ?? 0), 0);
  document.getElementById('rows').innerHTML = rows.map((r) => `<tr><td>${r[0]}</td><td>${yen(r[1])}</td><td>${yen(r[2])}</td><td>${yen(r[3])}</td></tr>`).join('');
  document.getElementById('total').innerHTML = `<td>合計</td><td>${yen(sum(1))}</td><td>${yen(sum(2))}</td><td>${yen(sum(3))}</td>`;
</script>
</body>
</html>
