name: deploy

# tests が main で通ったら、VPS で deploy.sh を実行する。
# 初回の準備（docs/server/setup-torudake.sh）が終わり、secrets を登録して
# リポジトリの変数 DEPLOY_ENABLED を true にするまでは動かない（docs/runbook.md）。
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: bash /var/www/torudake/deploy.sh

      - name: Verify private evidence storage permissions
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: bash /var/www/torudake/docs/server/check-evidence-permissions.sh

      # 反映が終わっても、公開サイトが外から見えて動いているかは別。見えなければここで失敗にする
      # （GitHub の失敗通知が届く）。反映の直後は定期処理・キューの印がまだ書かれていないので、再試行する。
      - name: Checkout (for the public-site check script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the public site from outside
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          RETRIES: '8'
          WAIT: '15'
        run: bash docs/server/check-public-site.sh
